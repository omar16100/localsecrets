[workspace]
resolver = "3"
members = [
    "crates/ls-core",
    "crates/ls-json",
    "crates/ls-http",
    "crates/ls-store",
    "crates/ls-server",
    "crates/ls-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Dependency policy: the standard library covers HTTP, storage, JSON, logging,
# argument parsing and time. The only third-party crates permitted are audited
# cryptographic primitives, because hand-written ciphers and KDFs fail quietly
# on side channels. Adding anything else needs a reason written down in
# docs/12092026_localsecrets_plan.md.
[workspace.dependencies]
ls-core = { path = "crates/ls-core" }
ls-json = { path = "crates/ls-json" }
ls-http = { path = "crates/ls-http" }
ls-store = { path = "crates/ls-store" }

aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
subtle = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
